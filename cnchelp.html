<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>M3U → TXT</title>
</head>
<body>

<h3>M3U → Channel,URL</h3>

<textarea id="input" rows="15" cols="70" placeholder="#EXTINF:-1,Channel
https://link"></textarea>

<br><br>
<button onclick="convert()">Convert</button>
<button onclick="download()">Download TXT</button>

<br><br>
<textarea id="output" rows="15" cols="70"></textarea>

<script>
function convert() {
    let lines = document.getElementById("input").value.split("\n");
    let result = "";
    let name = "";

    lines.forEach(line => {
        line = line.trim();

        // uzmi ime iz EXTINF
        if (line.startsWith("#EXTINF")) {
            let parts = line.split(",");
            name = parts[parts.length - 1].trim();
        }

        // uzmi URL (nije komentar)
        else if (line && !line.startsWith("#")) {
            result += name + "," + line + "\n";
        }
    });

    document.getElementById("output").value = result;
}

function download() {
    let text = document.getElementById("output").value;
    let blob = new Blob([text], { type: "text/plain" });
    let a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "channels.txt";
    a.click();
}
</script>

</body>
</html>
